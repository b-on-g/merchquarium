services:

  nka:
    build: .
    environment:
      BOG_MERCHQUARIUM_SEO_ORIGIN: https://${NKA_DOMAIN}
      BOG_MERCHQUARIUM_SEO_GOOGLE: ${NKA_GOOGLE:-}
      BOG_MERCHQUARIUM_SEO_YANDEX: ${NKA_YANDEX:-}
    logging:
      driver: "local"
    volumes:
      - nka_public:/nka/.baza
      - nka_private:/root/.local/share/mol_state_local
    restart: unless-stopped
    network_mode: host
    labels:
      caddy: ${NKA_DOMAIN}
      caddy.encode: zstd gzip
      caddy.reverse_proxy: ":9095"
      caddy_1: cmyser-ru-nka.91.188.212.151.ip.giper.dev
      caddy_1.redir: https://${NKA_DOMAIN}{uri} permanent

volumes:
  nka_public:
  nka_private:
