services:

  nka:
    build: .
    environment:
      BOG_PRILAVOK_SEO_ORIGIN: https://${NKA_DOMAIN}
      BOG_PRILAVOK_SEO_GOOGLE: ${NKA_GOOGLE:-}
      BOG_PRILAVOK_SEO_YANDEX: ${NKA_YANDEX:-}
    logging:
      driver: "local"
    volumes:
      - nka_public:/nka/.baza
      - nka_private:/root/.local/share/mol_state_local
    restart: unless-stopped
    network_mode: host
    labels:
      caddy: ${NKA_DOMAIN}
      caddy.encode: zstd gzip
      caddy.reverse_proxy: ":9095"

volumes:
  nka_public:
  nka_private:
